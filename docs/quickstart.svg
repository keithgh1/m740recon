<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .h    { font-size: 30px; font-weight: 700; fill: #1f2328; }
    .b    { font-size: 20px; fill: #1f2328; }
    .s    { font-size: 17px; fill: #59636e; }
    .tip  { font-size: 18px; fill: #1f2328; }
    .code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 19px; fill: #1f2328; }
    .flag { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 18px; font-weight: 700; fill: #0969da; }
    .num  { font-size: 28px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <!-- AI tip -->
  <rect x="2" y="2" width="896" height="46" rx="10" fill="#ddf4ff"/>
  <text x="22" y="32" class="tip">Tip: point Claude Code or another AI agent at this repository; <tspan font-weight="700">AGENTS.md</tspan> tells it what to do.</text>

  <!-- card 1 -->
  <rect x="2" y="66" width="896" height="182" rx="16" fill="#ffffff" stroke="#0969da" stroke-width="3"/>
  <circle cx="46" cy="110" r="24" fill="#0969da"/>
  <text x="46" y="120" text-anchor="middle" class="num">1</text>
  <text x="84" y="121" class="h">Just run it</text>
  <rect x="24" y="150" width="470" height="44" rx="8" fill="#eff2f5"/>
  <text x="40" y="179" class="code">m740recon rom.bin &gt; rom.asm</text>
  <text x="524" y="112" class="b">Detects the chip, load address</text>
  <text x="524" y="140" class="b">and dispatch tables for you.</text>
  <text x="524" y="170" class="s">The listing reassembles byte-exact.</text>
  <text x="524" y="214" class="b">Wrong chip?</text>
  <text x="652" y="214" class="flag">-m M50734</text>

  <!-- card 2 -->
  <rect x="2" y="266" width="896" height="182" rx="16" fill="#ffffff" stroke="#8250df" stroke-width="3"/>
  <circle cx="46" cy="310" r="24" fill="#8250df"/>
  <text x="46" y="320" text-anchor="middle" class="num">2</text>
  <text x="84" y="321" class="h">Let it find more</text>
  <rect x="24" y="350" width="470" height="44" rx="8" fill="#eff2f5"/>
  <text x="40" y="379" class="code">m740recon --suggest rom.bin &gt; fw.m740</text>
  <text x="524" y="312" class="b">Finds more code and drafts a</text>
  <text x="524" y="340" class="b">control file from what it found.</text>
  <text x="524" y="370" class="s">Each line says how sure it is, and why.</text>
  <text x="524" y="414" class="b">Just more code?</text>
  <text x="694" y="414" class="flag">-A</text>

  <!-- card 3 -->
  <rect x="2" y="466" width="896" height="182" rx="16" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <circle cx="46" cy="510" r="24" fill="#1a7f37"/>
  <text x="46" y="520" text-anchor="middle" class="num">3</text>
  <text x="84" y="521" class="h">Make it yours</text>
  <rect x="24" y="550" width="470" height="44" rx="8" fill="#eff2f5"/>
  <text x="40" y="579" class="code">m740recon -c fw.m740 rom.bin</text>
  <text x="524" y="512" class="b">Edit the draft: your names,</text>
  <text x="524" y="540" class="b">your pins, your hardware.</text>
  <text x="524" y="570" class="s">Lint shows where the file and the</text>
  <text x="524" y="594" class="s">firmware disagree.</text>

  <!-- caption -->
  <text x="450" y="684" text-anchor="middle" class="b" font-style="italic">Most people stop at 1. Everything after it is optional.</text>
</svg>
